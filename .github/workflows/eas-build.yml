name: EAS Build & Auto-Deploy

on:
  push:
    branches: [main]
    paths:
      # Nur neue Builds triggern, wenn Frontend-Code sich ändert
      - 'frontend/**'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch:
    # Manueller Trigger im GitHub-Actions-Tab
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [all, android, ios]
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]

jobs:
  build:
    name: EAS Build (${{ github.event.inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build on EAS (non-interactive)
        working-directory: frontend
        run: |
          eas build \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --non-interactive \
            --no-wait

      - name: Post build info to summary
        if: always()
        run: |
          echo "### 🚀 EAS Build Started" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ github.event.inputs.profile || 'preview' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ github.event.inputs.platform || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Track progress: https://expo.dev/accounts/${{ vars.EXPO_ACCOUNT || 'your-account' }}/projects/vitaguide/builds" >> $GITHUB_STEP_SUMMARY
