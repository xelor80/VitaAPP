name: VitaGuide Images

# Baut die Backend- und Admin-Images und pusht sie nach GHCR.
# Wird bei Änderungen unter health-platform/** auf dem Feature-Branch ausgelöst
# und lässt sich manuell starten.
on:
  push:
    branches:
      - claude/health-fitness-platform-7u4jsn
    paths:
      - "health-platform/backend/**"
      - "health-platform/admin-web/**"
      - ".github/workflows/vitaguide-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  API_BASE: https://api.vitaguide.app/api/v1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: health-platform/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vitaguide-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vitaguide-backend:${{ github.sha }}

      - name: Build & push admin
        uses: docker/build-push-action@v6
        with:
          context: health-platform/admin-web
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ env.API_BASE }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vitaguide-admin:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vitaguide-admin:${{ github.sha }}
