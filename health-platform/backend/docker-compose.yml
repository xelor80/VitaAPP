# Lokale Entwicklungsdienste für das VitaGuide-Backend.
# Start:  docker compose up -d
services:
  postgres:
    image: timescale/timescaledb:2.17.0-pg16
    environment:
      POSTGRES_USER: vitaguide
      POSTGRES_PASSWORD: vitaguide
      POSTGRES_DB: vitaguide
    ports:
      - "5432:5432"
    volumes:
      - vitaguide_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitaguide"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - vitaguide_redisdata:/data

volumes:
  vitaguide_pgdata:
  vitaguide_redisdata:
